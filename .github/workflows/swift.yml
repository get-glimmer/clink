name: iOS CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build-and-lint:
    name: Build & Lint SwiftUI App
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.0.app

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint with some rules disabled
        run: |
          swiftlint \
          --disable-rule static_over_final_class \
          --disable-rule line_length

      - name: Build SwiftUI app
        run: |
          xcodebuild build \
          -project mobile.xcodeproj \
          -scheme mobile \
          -destination 'platform=iOS Simulator,name=iPhone 15'

      # - name: Run Tests (commented out for now)
      #   run: |
      #     xcodebuild test \
      #     -project mobile.xcodeproj \
      #     -scheme mobile \
      #     -destination 'platform=iOS Simulator,name=iPhone 15'
