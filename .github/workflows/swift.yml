name: iOS CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build-and-lint:
    name: Build & Lint SwiftUI App
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.0.app

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint with rules disabled
        run: |
          printf "disabled_rules:\n  - static_over_final_class\n  - line_length\n  - type_name\n" > .swiftlint.yml
          swiftlint

